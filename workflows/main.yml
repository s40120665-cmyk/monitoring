name: Daily Price Monitor

# Настраиваем расписание запуска
on:
  schedule:
    # Робот будет запускаться каждый день в 03:00 по Гринвичу (это 06:00 по Москве)
    - cron: '0 3 * * *'
  # Эта строчка позволяет запускать скрипт вручную кнопкой в интерфейсе GitHub
  workflow_dispatch:

jobs:
  parse_and_save:
    runs-on: ubuntu-latest

    # Даем роботу права на запись файлов в наш репозиторий
    permissions:
      contents: write

    steps:
    # 1. Копируем файлы репозитория на виртуальный сервер GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Устанавливаем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Устанавливаем библиотеки для парсинга (BeautifulSoup и requests)
    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4

    # 4. Запускаем наш главный скрипт, который собирает цены
    - name: Run parser script
      run: python parser.py

    # 5. Самый важный шаг: сохраняем обновленный файл prices.csv обратно в GitHub
    - name: Commit and push changes
      run: |
        git config --global user.name "PriceBot"
        git config --global user.email "pricebot@github.com"
        # Проверяем, изменился ли файл prices.csv (появились ли новые цены)
        git add prices.csv || true
        # Если изменения есть — делаем коммит и отправляем в репозиторий
        if ! git diff --staged --quiet; then
          git commit -m "Авто-обновление цен: $(date +'%Y-%m-%d')"
          git push
        else
          echo "Новых данных для записи нет."
        fi
